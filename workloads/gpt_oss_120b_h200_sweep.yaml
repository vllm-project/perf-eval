# GPT-OSS 120B on H200 (TP=4) — Pareto sweep smoke test.
#
# Exercises `vllm_bench.sweep`: every (isl, osl) shape is measured across a
# x2 concurrency ladder on one server, so the dashboard rows can be plotted
# as tput_per_gpu vs interactivity (tok/s/user), InferenceX-style. Not
# nightly yet; bench_only skips the lm_eval/bfcl accuracy passes.
name: gpt_oss_120b-h200-sweep
gpu: H200
num_gpus: 8
nightly: false
bench_only: true

vllm:
  model: openai/gpt-oss-120b
  serve_args: >-
    --tensor-parallel-size 4
    --max-model-len 32768
    --max-num-seqs 512

vllm_bench:
  sweep:
    shapes:
      - {isl: 8192, osl: 1024}
      - {isl: 1024, osl: 1024}
    concurrency: {start: 4, end: 128}   # 4, 8, 16, 32, 64, 128
    prompts_per_concurrency: 4          # num_prompts = max(min_prompts, 4 x conc)
    min_prompts: 32
