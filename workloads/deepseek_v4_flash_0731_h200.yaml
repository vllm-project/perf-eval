# DeepSeek-V4-Flash-0731 on H200 (TP=2 × DP=4 + EP, DSpark spec-decode)
name: deepseek_v4_flash_0731-h200
gpu: H200
num_gpus: 8
nightly: true
timeout_in_minutes: 180

vllm:
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  env:
    # Keep TileLang's compiler and CUDA headers on the image's matched toolkit.
    CUDA_HOME: /usr/local/cuda
    TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
  serve_args: >-
    --tensor-parallel-size 2
    --data-parallel-size 4
    --enable-expert-parallel
    --max-model-len 32768
    --kv-cache-dtype fp8
    --block-size 256
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --reasoning-parser deepseek_v4
    --enable-auto-tool-choice
    --trust-remote-code
    --speculative_config.method=dspark
    --speculative_config.num_speculative_tokens=7
    --speculative_config.draft_sample_method=probabilistic

bfcl:
  test_categories:
    - simple_python
    - multiple
    - parallel
    - parallel_multiple
    - multi_turn
  num_threads: 8

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 32768
        max_gen_toks: 8192
