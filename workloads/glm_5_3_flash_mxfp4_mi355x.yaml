# amd/GLM-5.3-Flash-Quark-MXFP4 on MI355X; serve path per the GLM-5.3-Flash recipe (AMD).
name: glm_5_3_flash_mxfp4-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: amd/GLM-5.3-Flash-Quark-MXFP4
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: 1
    VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: 1
  serve_args: >-
    --tensor-parallel-size 4
    --max-num-seqs 512
    --attention-backend ROCM_AITER_MLA_SPARSE
    --tool-call-parser glm47
    --enable-auto-tool-choice
    --reasoning-parser glm47

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 65536

vllm_bench:
  metadata:
    precision: mxfp4
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
    - name: 1k-in-1k-out
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: [10, 256, 512]
      max_concurrency: [1, 64, 128]
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
