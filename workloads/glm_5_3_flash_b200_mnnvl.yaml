# bisect branch: same as glm_5_3_flash_b200.yaml with the pre-#56891 FlashInfer allreduce backend.
name: glm_5_3_flash-b200-mnnvl
gpu: B200
num_gpus: 4
nightly: true
vllm:
  model: zai-org/GLM-5.3-Flash
  serve_args: --tensor-parallel-size 4 --enable-expert-parallel --speculative-config.method
    mtp --speculative-config.num_speculative_tokens 5 --tool-call-parser glm47 --reasoning-parser
    glm45 --enable-auto-tool-choice
  env:
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: mnnvl
lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
  - name: gsm8k
    num_fewshot: 5
    model_args:
      num_concurrent: 64
      max_length: 40960
      max_gen_toks: 65536
vllm_bench:
  metadata:
    precision: fp8
  configs:
  - name: 8k-in-1k-out
    backend: openai
    dataset: random
    input_len: 8192
    output_len: 1024
    num_prompts: 512
    max_concurrency: 128
    repetitions: 3
    args:
      num_warmups: 128
