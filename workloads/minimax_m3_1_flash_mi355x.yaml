# MiniMax-M3.1-Flash on MI355X
# Recipe default (pulled 2026-11-13): https://recipes.vllm.ai/MiniMaxAI/MiniMax-M3.1-Flash?hardware=mi355x
name: minimax_m3_1_flash_mi355x
gpu: MI355X
num_gpus: 8
nightly: true
timeout_in_minutes: 300

vllm:
  model: MiniMaxAI/MiniMax-M3.1-Flash
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: 1
  serve_args: >-
    --block-size 128
    --disable-hybrid-kv-cache-manager
    --tensor-parallel-size 4
    --kv-cache-dtype nvfp4
    --attention-config {"indexer_kv_dtype":"nvfp4","indexer_decode_cp":true}
    --quantization-config.moe mxfp8
    --tool-call-parser minimax_m3
    --enable-auto-tool-choice
    --reasoning-parser minimax_m3
    --speculative-config {"method":"dspark","num_speculative_tokens":3,"attention_backend":"TRITON_ATTN","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic"}

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 32768
        max_gen_toks: 8192
    # Card's recommended sampling (temperature 1.0 is the task default, top_p 0.95) at max effort; card reports no GPQA/AIME and no max_tokens.
    - name: gpqa_diamond
      chat: true
      model_args:
        num_concurrent: 64
      gen_kwargs: &card {top_p: 0.95, reasoning_effort: max, max_gen_toks: 262144}
    - name: aime26
      chat: true
      model_args:
        num_concurrent: 64
      gen_kwargs: *card
    # lm-eval's 13 RULER tasks, run the way vllm#60397 ran NIAH: greedy, thinking on at high effort, 32K output tokens.
    - name: ruler_chat
      chat: true
      model_args:
        num_concurrent: 64
      gen_kwargs: {reasoning_effort: high}

vllm_bench:
  metadata:
    # MXFP8 checkpoint; the repo name has no precision marker.
    precision: mxfp8
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
    - name: 1k-in-1k-out
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: [10, 256, 512]
      max_concurrency: [1, 64, 128]
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
