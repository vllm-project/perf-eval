# Kimi-K3.1-Pro on AMD MI355X: Kimi Vendor Verifier (KVV), run_eval.sh's jobs
# for a K3 model with the benchmarks at effort max only, the one effort KVV's
# K3.1 Pro table reports. https://github.com/MoonshotAI/Kimi-Vendor-Verifier
# KVV judges BEAM with `kimi-k2.6`; here K3.1 Pro judges its own answers,
# served under that name too, so the BEAM score is not directly comparable to
# KVV's table. KVV's DeepSWE benchmark runs on the Pier platform, not
# run_eval.sh, and is not covered.
# Weekly, not nightly. On one node (ROCm nightly dev897, 2026-11-20/23) the
# jobs before BEAM took about 2.3 hours and beam_generate about 5; beam_judge
# is unmeasured. Server env matches kimi_k3_mi355x.
name: kimi_k3_1_pro-mi355x-kvv
gpu: MI355X
num_gpus: 8
nightly: false
timeout_in_minutes: 1440
# Rerun only when the agent is lost: a failed KVV job is a result, and a rerun
# costs the whole suite again.
retry:
  automatic:
    - exit_status: -1
      limit: 2

vllm:
  model: moonshotai/Kimi-K3.1-Pro
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    VLLM_ROCM_USE_AITER_MOE_SITUV2: 1
  serve_args: >-
    --served-model-name moonshotai/Kimi-K3.1-Pro kimi-k2.6
    --tensor-parallel-size 8
    --trust-remote-code
    --gpu-memory-utilization 0.88
    --max-model-len 1048576
    --tool-call-parser kimi_k3
    --reasoning-parser kimi_k3
    --enable-auto-tool-choice

kvv:
  ref: 7b938c38bbd89c2404a9ed5e7cb40da8079206b4
  # run_eval.sh all's order.
  jobs:
    - verify_parameters
    - verify_tool_call_json_schema
    - verify_toolcall_result_reject
    - verify_prompt_tokens
    - verify_k3_features
    - beam_generate
    - beam_judge
    - ocrbench_thinking_effort:max
    - MMMU_pro_thinking_effort:max
    - toolcall_thinking_effort:max
