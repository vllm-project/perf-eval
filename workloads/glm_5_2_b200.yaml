# GLM-5.2 FP8 customer-reproduction recipe migrated to one standalone 8xB300.
# Keep the server settings aligned with the supplied P6/B200 configuration so
# the 8K-input/1K-output concurrency points can be compared directly.
name: glm_5_2-b300-repro
gpu: B300
num_gpus: 8
nightly: false
bench_only: true

vllm:
  # Pre-staged on the standalone Axis host; avoids a second 700+ GB download.
  model: /raid/inf-simon/models/zai-org/GLM-5.2-FP8
  startup_timeout: 7200
  serve_args: >-
    --tensor-parallel-size 8
    --enable-expert-parallel
    --kv-cache-dtype fp8_e4m3
    --max-model-len 1048576
    --max-num-batched-tokens 32000
    --max-num-seqs 256
    --gpu-memory-utilization 0.92
    --enable-chunked-prefill
    --enable-prefix-caching
    --scheduling-policy priority
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 1

vllm_bench:
  configs:
    - name: 8k-in-1k-out-conc-64
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 256
      max_concurrency: 64
      args:
        num_warmups: 16
        disable_tqdm: true
    - name: 8k-in-1k-out-conc-256
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 256
      args:
        num_warmups: 16
        disable_tqdm: true
