# GLM-5.2 (NVFP4, modelopt re-quant) on B200 — TP=8 + EP, FP8 KV cache.
# vLLM auto-detects the NVFP4 quantization from the checkpoint.
name: glm_5_2-b200
gpu: B200
num_gpus: 8
nightly: true

vllm:
  model: nvidia/GLM-5.2-NVFP4
  serve_args: >-
    --tensor-parallel-size 8
    --enable-expert-parallel
    --kv-cache-dtype fp8_e4m3
    --tool-call-parser glm47
    --reasoning-parser glm45
    --enable-auto-tool-choice
    --chat-template-content-format=string

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 32768

bfcl:
  test_categories:
    - simple_python
    - multiple
    - parallel
    - parallel_multiple
    - multi_turn
  num_threads: 8

vllm_bench:
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      repetitions: 3
      args:
        num_warmups: 128
