# bisect branch: qwen3_5_h200 with prefix caching off. The bench reuses the same
# random prompts for warmup and every repetition, so with caching on it mostly
# measures cache hits (up to 96%) and repeats swing about 25%.
name: qwen3_5-h200-nopc
gpu: H200
num_gpus: 8
nightly: true
vllm:
  model: Qwen/Qwen3.5-397B-A17B-FP8
  serve_args: --tensor-parallel-size 8 --enable-expert-parallel --reasoning-parser
    qwen3 --language-model-only --trust-remote-code --max-num-seqs 256 --max-model-len
    auto --no-enable-prefix-caching
lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
  - name: gsm8k
    num_fewshot: 5
    model_args:
      num_concurrent: 64
      max_length: 40960
vllm_bench:
  configs:
  - name: 8k-in-1k-out
    backend: openai
    dataset: random
    input_len: 8192
    output_len: 1024
    num_prompts: 256
    max_concurrency: 128
    repetitions: 3
    args:
      num_warmups: 128
