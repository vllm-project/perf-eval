# GLM-5.2 FP8 tuned comparison recipe on a single 8xB200 node.
# Run after glm_5_2_b200.yaml to measure the effect of a larger token budget,
# lower sequence cap, disabled random-prefix cache, and MTP depth 5.
name: glm_5_2-b200-tuned
gpu: B200
num_gpus: 8
nightly: false
bench_only: true

vllm:
  model: zai-org/GLM-5.2-FP8
  startup_timeout: 7200
  serve_args: >-
    --tensor-parallel-size 8
    --kv-cache-dtype fp8_e4m3
    --max-model-len 1048576
    --max-num-batched-tokens 65536
    --max-num-seqs 64
    --gpu-memory-utilization 0.92
    --enable-chunked-prefill
    --no-enable-prefix-caching
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 5

vllm_bench:
  configs:
    - name: 8k-in-1k-out-conc-64
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 256
      max_concurrency: 64
      args:
        num_warmups: 16
        disable_tqdm: true
    - name: 8k-in-1k-out-conc-256
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 256
      args:
        num_warmups: 16
        disable_tqdm: true
