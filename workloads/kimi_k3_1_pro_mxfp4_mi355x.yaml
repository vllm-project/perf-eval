# moonshotai/Kimi-K3.1-Pro (native MXFP4, ~1.56 TB) on MI355X, TP8. Baseline (no DCP/spec-decode).
name: kimi_k3_1_pro_mxfp4-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: moonshotai/Kimi-K3.1-Pro
  env:
    VLLM_ROCM_USE_AITER: 1
    SAFETENSORS_FAST_GPU: 1
    VLLM_ROCM_USE_AITER_MOE_SITUV2: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 1
    VLLM_ENGINE_READY_TIMEOUT_S: 7200
  serve_args: >-
    --tensor-parallel-size 8
    --trust-remote-code
    --language-model-only
    --max-model-len 65536
    --max-num-batched-tokens 10240
    --gpu-memory-utilization 0.92
    --kv-cache-dtype fp8
    --tool-call-parser kimi_k3
    --enable-auto-tool-choice
    --reasoning-parser kimi_k3
    --compilation-config {"cudagraph_capture_sizes":[1,2,4,8,16,24,32,48,64,96,128,256]}

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 16
        max_length: 32768
        max_gen_toks: 8192

vllm_bench:
  metadata:
    precision: mxfp4
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
    - name: 1k-in-1k-out
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: [10, 256, 512]
      max_concurrency: [1, 64, 128]
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
