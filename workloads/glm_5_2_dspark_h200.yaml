# GLM-5.2 (FP8) on H200 with DSpark spec-decode (RedHatAI speculator, 7 tokens)

name: glm_5_2_dspark-h200
gpu: H200
num_gpus: 8
nightly: true
timeout_in_minutes: 180

vllm:
  model: zai-org/GLM-5.2-FP8
  serve_args: >-
    --kv-cache-dtype bfloat16
    --max-model-len 32768
    --tensor-parallel-size 8
    --speculative-config.method dspark
    --speculative-config.model RedHatAI/GLM-5.2-speculator.dspark
    --speculative-config.num_speculative_tokens 7
    --tool-call-parser glm47
    --reasoning-parser glm45
    --enable-auto-tool-choice
    --chat-template-content-format=string

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 32768

bfcl:
  test_categories:
    - simple_python
    - multiple
    - parallel
    - parallel_multiple
    - multi_turn
  num_threads: 8

vllm_bench:
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      repetitions: 3
      args:
        num_warmups: 128
