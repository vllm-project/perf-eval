# GLM-5.2 (FP8) on AMD MI355X
name: glm_5_2-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: zai-org/GLM-5.2-FP8
  env:
    VLLM_ROCM_USE_AITER: 1
    # OMP_NUM_THREADS=1 workaround after weight loading regression from https://github.com/vllm-project/vllm/pull/49919
    OMP_NUM_THREADS: 1
  serve_args: >-
    --tensor-parallel-size 8
    --trust-remote-code

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 32768

vllm_bench:
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
