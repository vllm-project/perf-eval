# Kimi-K3.1-Pro on AMD MI355X
# Recipe default (pulled 2026-11-13): https://recipes.vllm.ai/moonshotai/Kimi-K3.1-Pro?hardware=mi355x
name: kimi_k3_1_pro_mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: moonshotai/Kimi-K3.1-Pro
  env:
    VLLM_ROCM_USE_AITER: 1
    SAFETENSORS_FAST_GPU: 1
    VLLM_ROCM_USE_AITER_MOE_SITUV2: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 1
  serve_args: >-
    --tensor-parallel-size 8
    --trust-remote-code
    --enable-auto-tool-choice
    --tool-call-parser kimi_k3
    --reasoning-parser kimi_k3

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 32768
        max_gen_toks: 8192

vllm_bench:
  metadata:
    # The default K3.1 checkpoint is MXFP4; the repo name has no precision marker.
    precision: mxfp4
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
    - name: 1k-in-1k-out
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: [10, 256, 512]
      max_concurrency: [1, 64, 128]
      speed_bench_dataset_subset: throughput_8k
      speed_bench_category: low_entropy
