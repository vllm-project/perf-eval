# ruler_chat without 256K, for models whose context is under 256K plus the 32K output budget.
group: ruler_chat_128k
task:
  - task: ruler_chat_niah_single_1
    metadata: &lengths
      version: 1.0                  # replaces the task's metadata, so restate its version
      max_seq_lengths: [32768, 131072]
  - task: ruler_chat_niah_multikey_2
    metadata: *lengths
  - task: ruler_chat_niah_multikey_3
    metadata: *lengths
aggregate_metric_list:
  - metric: "32768"
    weight_by_size: False
  - metric: "131072"
    weight_by_size: False
metadata:
  version: 1
