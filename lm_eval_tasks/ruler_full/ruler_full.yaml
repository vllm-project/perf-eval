# lm-eval's 13 RULER tasks at the paper's 4K-128K lengths, 500 samples each; scores are per-length means over tasks.
group: ruler_full
task:
  - task: niah_single_1
    metadata: &lengths
      version: 1.0                  # replaces upstream's metadata, so restate its version
      max_seq_lengths: [4096, 8192, 16384, 32768, 65536, 131072]
  - task: niah_single_2
    metadata: *lengths
  - task: niah_single_3
    metadata: *lengths
  - task: niah_multikey_1
    metadata: *lengths
  - task: niah_multikey_2
    metadata: *lengths
  - task: niah_multikey_3
    metadata: *lengths
  - task: niah_multiquery
    metadata: *lengths
  - task: niah_multivalue
    metadata: *lengths
  - task: ruler_vt
    custom_dataset: !function utils.get_vt_dataset   # WORKAROUND for a name-collision crash, see utils.py
    metadata: *lengths
  - task: ruler_cwe
    metadata: *lengths
  - task: ruler_fwe
    metadata: *lengths
  - task: ruler_qa_squad
    metadata: *lengths
  - task: ruler_qa_hotpot
    metadata: *lengths
aggregate_metric_list:
  - metric: "4096"
    weight_by_size: False
  - metric: "8192"
    weight_by_size: False
  - metric: "16384"
    weight_by_size: False
  - metric: "32768"
    weight_by_size: False
  - metric: "65536"
    weight_by_size: False
  - metric: "131072"
    weight_by_size: False
metadata:
  version: 1
